services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: true

  Devsk\DsNotifier\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Attribute/*'
      - '../Classes/Event/*'
      - '../Classes/Domain/Model/*'

  # Expose form persistence manager so GeneralUtility::makeInstance() can resolve it
  # from the container in static contexts (e.g. SubmitFinisherEvent::getMarkerPlaceholders).
  TYPO3\CMS\Form\Mvc\Persistence\FormPersistenceManager:
    public: true

  Devsk\DsNotifier\EventListener\NotifierListener:
    tags:
      - name: event.listener

  Devsk\DsNotifier\EventListener\Typo3\Core\Cache\CacheFlushListener:
    tags:
      - name: event.listener

  Devsk\DsNotifier\EventListener\Typo3\Core\Cache\CacheWarmupListener:
    tags:
      - name: event.listener

  Devsk\DsNotifier\EventListener\FlexForm\NotifierFlexFormListener:
    tags:
      - name: event.listener
        method: modifyIdentifier
        event: TYPO3\CMS\Core\Configuration\Event\AfterFlexFormDataStructureIdentifierInitializedEvent
      - name: event.listener
        method: provideDataStructure
        event: TYPO3\CMS\Core\Configuration\Event\BeforeFlexFormDataStructureParsedEvent

